<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestSnapper</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 TestSnapper</h1>
      <p class="subtitle">Record UI Test Steps</p>
    </header>

    <div class="state-indicator" id="stateIndicator">
      <div class="state-dot" id="stateDot"></div>
      <span id="stateText">Idle</span>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Steps Recorded</span>
        <span class="stat-value" id="stepCount">0</span>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary" data-testid="start-recording-btn">
        <span class="btn-icon">▶️</span>
        <span>Start Recording</span>
      </button>

      <button id="pauseBtn" class="btn btn-warning" disabled data-testid="pause-recording-btn">
        <span class="btn-icon">⏸️</span>
        <span>Pause</span>
      </button>

      <button id="resumeBtn" class="btn btn-success" disabled data-testid="resume-recording-btn">
        <span class="btn-icon">▶️</span>
        <span>Resume</span>
      </button>

      <button id="stopBtn" class="btn btn-danger" disabled data-testid="stop-recording-btn">
        <span class="btn-icon">⏹️</span>
        <span>Stop</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="export-section">
      <h3>Export Recording</h3>
      <div class="session-select" id="sessionSelect">
        <select id="sessionDropdown" class="select" data-testid="session-dropdown">
          <option value="">Select a session...</option>
        </select>
      </div>

      <div class="export-format">
        <label>Export Format:</label>
        <div class="format-options">
          <label class="radio-label">
            <input type="radio" name="format" value="json" checked data-testid="format-json">
            <span>JSON</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="format" value="csv" data-testid="format-csv">
            <span>CSV</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="format" value="markdown" data-testid="format-markdown">
            <span>Markdown</span>
          </label>
        </div>
      </div>

      <button id="exportBtn" class="btn btn-export" disabled data-testid="export-btn">
        <span class="btn-icon">📥</span>
        <span>Export Session</span>
      </button>

      <button id="viewStepsBtn" class="btn btn-secondary" disabled data-testid="view-steps-btn">
        <span class="btn-icon">👁️</span>
        <span>View Steps</span>
      </button>
    </div>

    <div class="steps-viewer" id="stepsViewer" style="display: none;">
      <h3>Recorded Steps</h3>
      <div id="stepsList" class="steps-list"></div>
      <button id="closeStepsBtn" class="btn btn-secondary">Close</button>
    </div>

    <div class="message" id="message"></div>

    <footer>
      <p>TestSnapper v1.1.0</p>
    </footer>
  </div>

  <script src="../../popup.js"></script>
</body>
</html>
