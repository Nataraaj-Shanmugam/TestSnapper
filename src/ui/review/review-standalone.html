<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Session - TestSnapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="review-standalone.css">
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar for Settings and Metadata -->
        <aside class="sidebar">
            <div class="header-logo">
                <h1 style="font-size: 20px; color: var(--primary);">
                    <span style="font-size: 24px;">📋</span> TestSnapper
                </h1>
            </div>

            <div class="session-settings-card">
                <div class="field-group">
                    <label>Session Name</label>
                    <input type="text" id="sessionName" class="input-styled" placeholder="Session name..."
                        autocomplete="off">
                </div>

                <div class="field-group">
                    <label>Export Format</label>
                    <select id="exportFormat" class="select-styled">
                        <option value="docx">Microsoft Word (.docx)</option>
                        <option value="json">JSON Format (Data)</option>
                        <option value="csv">Excel / CSV (.csv)</option>
                        <option value="pdf">PDF Document (.pdf)</option>
                    </select>
                </div>

                <div class="meta-info"
                    style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); margin-bottom: 24px;">
                    <div class="meta-item">
                        <span class="meta-label">Created:</span>
                        <span id="sessionDate" style="font-size: 13px;">-</span>
                    </div>
                    <div class="meta-item" style="margin-top: 8px;">
                        <span class="meta-label">Steps:</span>
                        <span id="sessionStepCount" style="font-size: 13px;">-</span>
                    </div>
                </div>

                <div class="sidebar-actions" style="display: flex; flex-direction: column; gap: 12px;">
                    <button id="saveExportBtn" class="btn btn-primary" style="width: 100%;">
                        <span>💾</span> Export Documentation
                    </button>

                    <button id="cancelBtn" class="btn btn-secondary" style="width: 100%;">
                        <span>✖️</span> Close
                    </button>
                </div>
            </div>


        </aside>

        <!-- Main Review Area -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Review & Refine</h1>
                    <p style="color: var(--text-muted); font-size: 14px;">Review your captured interactions and export
                        your documentation.</p>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn" title="Toggle Theme"
                        style="width: 42px; height: 42px; font-size: 20px;">
                        <span class="icon">🌙</span>
                    </button>
                    <button id="bulkDeleteBtn" class="btn btn-danger" disabled
                        style="height: 42px; padding: 0 16px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; white-space: nowrap;">
                        <span style="margin-right: 8px;">🗑️</span> Delete Selection
                    </button>
                    <button id="undoBtn" class="icon-btn" disabled title="Undo (Ctrl+Z)"
                        style="width: 42px; height: 42px;">
                        <span style="font-size: 18px;">↶</span>
                    </button>
                </div>
            </header>

            <!-- Notification Area -->
            <div id="message" class="message hidden" style="margin-bottom: 20px;"></div>

            <!-- Toolbar -->
            <section class="toolbar">
                <div class="search-wrapper">
                    <span class="icon">🔍</span>
                    <input type="text" id="stepSearch" class="input-styled search-input"
                        placeholder="Search steps, actions, or values...">
                </div>
                <select id="actionFilter" class="select-styled" style="width: 180px;">
                    <option value="all">All Actions</option>
                    <option value="click">Click</option>
                    <option value="type">Type</option>
                    <option value="navigate">Navigate</option>
                    <option value="select">Select</option>
                    <option value="check">Check</option>
                    <option value="submit">Submit</option>
                    <option value="screenshot">Screenshot</option>
                </select>
                <button id="clearFiltersBtn" class="btn btn-secondary">Clear</button>
            </section>

            <div id="stepResultsSummary"
                style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; font-weight: 500;"></div>

            <!-- Steps List -->
            <div id="stepsContainer" class="steps-container">
                <div class="loading" style="text-align: center; padding: 40px;">Loading documented steps...</div>
            </div>

            <div id="noResultsMsg" class="hidden" style="text-align: center; padding: 60px; color: var(--text-muted);">
                <span style="font-size: 40px; display: block; margin-bottom: 16px;">🔍</span>
                <p>No steps match your current filters.</p>
            </div>
        </main>


    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="addStepModal">
        <div class="modal-card">
            <h3 style="margin-bottom: 24px;">➕ Add Manual Step</h3>

            <div class="field-group">
                <label>Step Description *</label>
                <textarea id="newStepDescription" class="input-styled" style="min-height: 80px;"
                    placeholder="Describe what happens in this step..."></textarea>
            </div>

            <div class="field-group">
                <label>Action Category</label>
                <select id="newStepAction" class="select-styled">
                    <option value="click">Click</option>
                    <option value="type">Type</option>
                    <option value="navigate">Navigate</option>
                    <option value="select">Select</option>
                    <option value="check">Check</option>
                    <option value="submit">Submit</option>
                    <option value="custom">Custom Action</option>
                </select>
            </div>

            <div class="field-group">
                <label>Screenshot</label>
                <div id="screenshotUpload"
                    style="border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer;">
                    <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
                    <span style="font-size: 24px; display: block; margin-bottom: 8px;">📸</span>
                    <p style="font-size: 13px; color: var(--text-muted);">Drop image here or click to upload</p>
                    <img id="screenshotPreview"
                        style="max-width: 100%; margin-top: 16px; border-radius: 8px; display: none;">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                <button id="cancelAddStep" class="btn btn-secondary">Cancel</button>
                <button id="confirmAddStep" class="btn btn-primary">Add Step</button>
            </div>
        </div>
    </div>

    <!-- Export Progress -->
    <div class="modal-overlay" id="progressModal">
        <div class="modal-card" style="max-width: 400px; text-align: center;">
            <div id="exportLoader" style="margin-bottom: 24px;">
                <svg width="50" height="50" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="var(--border)" stroke-width="4" />
                    <circle id="progressCircle" cx="25" cy="25" r="20" fill="none" stroke="var(--primary)"
                        stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6" stroke-linecap="round"
                        style="transition: stroke-dashoffset 0.3s ease;" />
                </svg>
            </div>
            <h3 id="progressPercent" style="font-size: 24px;">0%</h3>
            <p id="progressStatus" style="color: var(--text-muted); margin-top: 8px; margin-bottom: 24px;">Preparing
                export...</p>

            <button id="cancelExportBtn" class="btn btn-danger" style="width: 100%;">Cancel Export</button>
        </div>
    </div>

    <script type="module" src="review-standalone.js"></script>
</body>

</html>
