<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Session - TestSnapper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-color: #e5e7eb;
            --border-hover: #d1d5db;
            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --color-danger: #ef4444;
            --color-success: #10b981;
            --hover-bg: #f3f4f6;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1f2937;
                --bg-secondary: #111827;
                --text-primary: #f3f4f6;
                --text-secondary: #9ca3af;
                --text-tertiary: #6b7280;
                --border-color: #374151;
                --border-hover: #4b5563;
                --color-primary: #60a5fa;
                --color-primary-hover: #3b82f6;
                --color-danger: #f87171;
                --color-success: #34d399;
                --hover-bg: #374151;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--color-primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: var(--color-danger);
        }

        .btn-secondary {
            background: var(--text-secondary);
        }

        .btn-primary {
            background: var(--color-primary);
            padding: 12px 24px;
            font-size: 15px;
        }

        .btn-cancel {
            background: var(--text-secondary);
        }

        .message {
            display: none;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-danger);
            border: 1px solid var(--color-danger);
        }

        .message.info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
        }

        .session-info {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }

        .session-field {
            margin-bottom: 16px;
        }

        .session-field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .session-name-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 18px;
            font-weight: 500;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .session-name-input:hover {
            border-color: var(--border-hover);
        }

        .session-name-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .session-meta {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .export-format {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .export-format label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .export-format select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-format select:hover {
            border-color: var(--border-hover);
        }

        .export-format select:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .steps-container {
            margin-bottom: 30px;
        }

        .step-wrapper {
            position: relative;
            margin-bottom: 2px;
        }

        .hover-line {
            position: relative;
            height: 30px;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-wrapper:hover .hover-line {
            opacity: 1;
        }

        .hover-line::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: var(--border-color);
            left: 0;
            top: 50%;
        }

        .add-step-btn {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--color-primary);
            background: var(--bg-primary);
            color: var(--color-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .add-step-btn:hover {
            background: var(--color-primary);
            color: white;
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .step-item:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .step-checkbox {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .step-screenshot {
            margin: 10px 0 20px 45px;
            border-left: 2px solid var(--border-color);
            padding-left: 10px;
            transition: all 0.3s ease;
        }

        .step-screenshot img {
            max-width: 600px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none;
        }

        .toggle-img-btn {
            font-size: 18px;
        }

        .step-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-field {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .step-field label {
            min-width: 80px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .step-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 14px;
            background: transparent;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .step-doc-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s ease;
            position: relative;
        }

        .step-doc-line:hover {
            background: var(--hover-bg);
        }

        .step-doc-line:hover .add-step-after {
            opacity: 1;
        }

        .add-step-after {
            position: absolute;
            right: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-primary);
            color: white;
            border: 2px solid var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            z-index: 10;
            font-size: 18px;
            font-weight: bold;
            box-shadow: var(--shadow-md);
        }

        .add-step-after:hover {
            background: var(--color-primary-hover);
            transform: translateY(-50%) scale(1.1);
        }

        .step-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .step-number {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .step-text {
            flex: 1;
            font-size: 15px;
            color: var(--text-primary);
        }

        .step-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--color-primary);
        }

        .icon-btn.delete-btn:hover {
            color: var(--color-danger);
        }

        .step-input:not([readonly]):hover {
            background: var(--hover-bg);
        }

        .step-input:not([readonly]) {
            border-color: var(--border-color);
        }

        .step-input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .step-input[readonly] {
            cursor: default;
        }

        .icon-btn.edit-btn:hover {
            color: var(--color-primary);
        }

        .bottom-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 24px;
            border-top: 2px solid var(--border-color);
            background: var(--bg-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        /* Add Step / Progress Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 20px;
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-field input,
        .form-field textarea,
        .form-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .screenshot-upload {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .screenshot-upload:hover {
            border-color: var(--color-primary);
            background: var(--hover-bg);
        }

        .screenshot-upload.has-image {
            border-style: solid;
            border-color: var(--color-success);
        }

        .screenshot-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* Drag handle + drag states */
        .drag-handle {
            cursor: grab;
            font-size: 16px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
        }

        .step-doc-line.dragging {
            opacity: 0.6;
            background: rgba(59, 130, 246, 0.05);
        }

        .step-doc-line.drag-over {
            border-top: 2px solid var(--color-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }

            header h1 {
                font-size: 22px;
            }

            .header-content {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .session-meta {
                flex-direction: column;
                gap: 8px;
            }

            .step-field {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .step-field label {
                min-width: auto;
            }

            .bottom-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>
                    <span>📋</span>
                    <span>Review Test Session</span>
                </h1>
                <div class="header-actions">
                    <button id="undoBtn" class="btn btn-secondary" disabled title="Undo (Ctrl+Z / Cmd+Z)">
                        <span>↶</span>
                        <span>Undo</span>
                    </button>
                    <!-- <button id="redoBtn" class="btn btn-secondary" disabled style="opacity: 0.4; cursor: not-allowed;">
                        <span>↷</span>
                        <span>Redo</span>
                    </button> -->
                    <button id="bulkDeleteBtn" class="btn btn-danger" disabled>
                        <span>🗑️</span>
                        <span>Delete Selected</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="message" id="message"></div>

        <div class="session-info">
            <div class="session-field">
                <label>Session Name:</label>
                <input type="text" id="sessionName" class="session-name-input" placeholder="Enter session name..."
                    autocomplete="off">
            </div>
            <div class="session-meta">
                <span id="sessionDate"></span>
                <span id="sessionStepCount"></span>
            </div>
            <div class="export-format">
                <label>Export Format:</label>
                <select id="exportFormat">
                    <option value="docx">DOCX (Microsoft Word)</option>
                    <option value="json">JSON (Data Format)</option>
                    <option value="csv">CSV (Spreadsheet)</option>
                    <option value="pdf">TXT (Document)</option>
                </select>
            </div>
        </div>

        <!-- Search / Filter Toolbar -->
        <div class="steps-toolbar"
            style="margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="stepSearch" placeholder="🔍 Search steps..."
                style="flex: 1; min-width: 180px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
            <select id="actionFilter"
                style="padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
                <option value="all">All Actions</option>
                <option value="click">Click</option>
                <option value="type">Type</option>
                <option value="navigate">Navigate</option>
                <option value="select">Select</option>
                <option value="check">Check</option>
                <option value="submit">Submit</option>
                <option value="screenshot">Screenshot</option>
            </select>
            <button id="clearFiltersBtn" class="btn btn-secondary" style="white-space: nowrap;">
                Clear Filters
            </button>
        </div>
        <div id="stepResultsSummary"
            style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; min-height: 16px;"></div>
        <div id="noResultsMsg" class="hidden"
            style="margin-bottom: 10px; font-size: 13px; color: var(--text-secondary);">
            No results found for the current filters.
        </div>

        <div class="steps-container" id="stepsContainer">
            <div class="loading">Loading steps</div>
        </div>

        <div class="bottom-actions">
            <button id="saveExportBtn" class="btn btn-primary">
                <span>💾</span>
                <span>Save & Export</span>
            </button>
            <button id="cancelBtn" class="btn btn-secondary">
                <span>✖️</span>
                <span>Close</span>
            </button>
        </div>
    </div>

    <!-- Add Step Modal -->
    <div class="modal-overlay" id="addStepModal">
        <div class="modal">
            <h3>➕ Add New Step</h3>

            <div class="form-field">
                <label>Step Description *</label>
                <textarea id="newStepDescription" placeholder="Enter step description..." required></textarea>
            </div>

            <div class="form-field">
                <label>Action Type</label>
                <select id="newStepAction">
                    <option value="click">Click</option>
                    <option value="type">Type</option>
                    <option value="navigate">Navigate</option>
                    <option value="select">Select</option>
                    <option value="check">Check</option>
                    <option value="submit">Submit</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="form-field">
                <label>Screenshot (Optional)</label>
                <div class="screenshot-upload" id="screenshotUpload">
                    <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
                    <p style="color: var(--text-secondary); margin: 0;">
                        📸 Click to upload screenshot or drag & drop
                    </p>
                    <img id="screenshotPreview" class="screenshot-preview" style="display: none;">
                </div>
            </div>

            <div class="modal-actions">
                <button id="cancelAddStep" class="btn btn-cancel">Cancel</button>
                <button id="confirmAddStep" class="btn btn-primary">Add Step</button>
            </div>
        </div>
    </div>

    <!-- Export Progress Modal -->
    <div class="modal-overlay" id="progressModal">
        <div class="modal" style="max-width: 420px;">
            <h3>Exporting...</h3>
            <div class="form-field" style="margin-top: 12px;">
                <div class="progress-bar"
                    style="width: 100%; height: 10px; background: var(--bg-secondary); border-radius: 999px; overflow: hidden; border: 1px solid var(--border-color);">
                    <div class="progress-fill" id="progressFill"
                        style="width: 0%; height: 100%; background: var(--color-primary); transition: width 0.2s ease;">
                    </div>
                </div>
            </div>
            <p id="progressStatus" style="margin-top: 10px; font-size: 13px; color: var(--text-secondary);">
                Starting export...
            </p>
            <p id="progressPercent" style="margin-top: 4px; font-size: 13px; font-weight: 600;">
                0%
            </p>
            <div class="modal-actions">
                <button id="cancelExportBtn" class="btn btn-cancel">Cancel Export</button>
            </div>
        </div>
    </div>

    <script type="module" src="review-standalone.js"></script>
</body>

</html>
