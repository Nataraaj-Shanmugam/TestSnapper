<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEC-002: Content Security Policy for enhanced security -->
    <!-- UX-018: Google Fonts removed for offline reliability and privacy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self';">
    <title>Review Session - TestSnapper</title>
    <!-- UX-006: Apply theme before first paint to prevent flash -->
    <script src="../theme-init.js"></script>
    <link rel="stylesheet" href="review-standalone.css">
</head>

<body>
    <div class="app-wrapper">
        <!-- Mobile sidebar toggle -->
        <button id="sidebarToggle" class="sidebar-toggle" title="Toggle Sidebar" aria-label="Toggle sidebar">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <!-- Sidebar overlay for mobile -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <!-- Sidebar for Settings and Metadata -->
        <aside class="sidebar" id="sidebar">
            <div class="header-logo">
                <h1 style="font-size: 20px; color: var(--accent);">
                    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> TestSnapper
                </h1>
            </div>

            <div class="session-settings-card">
                <div class="field-group">
                    <label>Session Name</label>
                    <input type="text" id="sessionName" class="input-styled" placeholder="Session name..."
                        autocomplete="off">
                </div>

                <div class="field-group">
                    <label>Export Format</label>
                    <select id="exportFormat" class="select-styled">
                        <option value="docx">Microsoft Word (.docx)</option>
                        <option value="json">JSON Format (Data)</option>
                        <option value="csv">Excel / CSV (.csv)</option>
                        <option value="pdf">PDF Document (.pdf)</option>
                    </select>
                </div>

                <div class="meta-info"
                    style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); margin-bottom: 24px;">
                    <div class="meta-item">
                        <span class="meta-label">Created:</span>
                        <span id="sessionDate" style="font-size: 13px;">-</span>
                    </div>
                    <div class="meta-item" style="margin-top: 8px;">
                        <span class="meta-label">Steps:</span>
                        <span id="sessionStepCount" style="font-size: 13px;">-</span>
                    </div>
                </div>

                <div class="sidebar-actions" style="display: flex; flex-direction: column; gap: 12px;">
                    <button id="saveExportBtn" class="btn btn-primary" style="width: 100%;">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Documentation
                    </button>

                    <button id="cancelBtn" class="btn btn-secondary" style="width: 100%;">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Close
                    </button>
                </div>
            </div>


        </aside>

        <!-- Main Review Area -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Review & Refine</h1>
                    <p style="color: var(--text-muted); font-size: 14px;">Review your captured interactions and export
                        your documentation.</p>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn" title="Toggle Theme"
                        style="width: 42px; height: 42px;">
                        <span class="icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                    </button>
                    <button id="bulkDeleteBtn" class="btn btn-danger" disabled
                        style="height: 42px; padding: 0 16px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; white-space: nowrap;">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Delete Selection
                    </button>
                    <button id="undoBtn" class="icon-btn" disabled title="Undo (Ctrl+Z)"
                        style="width: 42px; height: 42px;">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    </button>
                </div>
            </header>

            <!-- Notification Area -->
            <div id="message" class="message hidden" style="margin-bottom: 20px;"></div>

            <!-- Toolbar -->
            <section class="toolbar">
                <div class="search-wrapper">
                    <span class="icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <input type="text" id="stepSearch" class="input-styled search-input"
                        placeholder="Search steps, actions, or values...">
                </div>
                <select id="actionFilter" class="select-styled" style="width: 180px;">
                    <option value="all">All Actions</option>
                    <option value="click">Click</option>
                    <option value="type">Type</option>
                    <option value="navigate">Navigate</option>
                    <option value="select">Select</option>
                    <option value="check">Check</option>
                    <option value="submit">Submit</option>
                    <option value="screenshot">Screenshot</option>
                </select>
                <button id="clearFiltersBtn" class="btn btn-secondary">Clear</button>
            </section>

            <div id="stepResultsSummary"
                style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; font-weight: 500;"></div>

            <!-- Steps List -->
            <div id="stepsContainer" class="steps-container">
                <div class="loading" style="text-align: center; padding: 40px;">Loading documented steps...</div>
            </div>

            <div id="noResultsMsg" class="hidden" style="text-align: center; padding: 60px; color: var(--text-muted);">
                <span style="display: block; margin-bottom: 16px; color: var(--text-disabled);" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                <p>No steps match your current filters.</p>
            </div>

            <!-- UX-008: Persistent keyboard-accessible add step button -->
            <div style="text-align: center; padding: 16px;">
                <button id="addStepAtEndBtn" class="btn btn-secondary"
                        aria-label="Add new step at end of session">
                    + Add Step
                </button>
            </div>
        </main>


    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="addStepModal">
        <div class="modal-card">
            <h3 style="margin-bottom: 24px;">Add Manual Step</h3>

            <div class="field-group">
                <label>Step Description *</label>
                <textarea id="newStepDescription" class="input-styled" style="min-height: 80px;"
                    placeholder="Describe what happens in this step..."></textarea>
            </div>

            <div class="field-group">
                <label>Action Category</label>
                <select id="newStepAction" class="select-styled">
                    <option value="click">Click</option>
                    <option value="type">Type</option>
                    <option value="navigate">Navigate</option>
                    <option value="select">Select</option>
                    <option value="check">Check</option>
                    <option value="submit">Submit</option>
                    <option value="custom">Custom Action</option>
                </select>
            </div>

            <div class="field-group">
                <label>Screenshot</label>
                <div id="screenshotUpload" role="button" tabindex="0" aria-label="Upload screenshot"
                    style="border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer;">
                    <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
                    <span style="display: block; margin-bottom: 8px; color: var(--text-muted);" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
                    <p style="font-size: 13px; color: var(--text-muted);">Drop image here or click to upload</p>
                    <img id="screenshotPreview"
                        style="max-width: 100%; margin-top: 16px; border-radius: 8px; display: none;">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                <button id="cancelAddStep" class="btn btn-secondary">Cancel</button>
                <button id="confirmAddStep" class="btn btn-primary">Add Step</button>
            </div>
        </div>
    </div>

    <!-- Export Progress -->
    <div class="modal-overlay" id="progressModal">
        <div class="modal-card" style="max-width: 400px; text-align: center;">
            <div id="exportLoader" style="margin-bottom: 24px;">
                <svg width="50" height="50" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="var(--border)" stroke-width="4" />
                    <circle id="progressCircle" cx="25" cy="25" r="20" fill="none" stroke="var(--primary)"
                        stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6" stroke-linecap="round"
                        style="transition: stroke-dashoffset 0.3s ease;" />
                </svg>
            </div>
            <h3 id="progressPercent" style="font-size: 24px;">0%</h3>
            <p id="progressStatus" style="color: var(--text-muted); margin-top: 8px; margin-bottom: 24px;">Preparing
                export...</p>

            <button id="cancelExportBtn" class="btn btn-danger" style="width: 100%;">Cancel Export</button>
        </div>
    </div>

    <script type="module" src="review-standalone.js"></script>
</body>

</html>
